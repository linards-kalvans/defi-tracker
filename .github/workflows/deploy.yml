name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Build and Publish"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Navigate to project directory (or clone if not exists)
            # Adjust path as needed
            mkdir -p ~/apps/crypto-tracker
            cd ~/apps/crypto-tracker

            # Login to GHCR (required if package is private)
            # You might need to add: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u USERNAME --password-stdin
            
            # Pull latest images
            docker compose pull

            # Restart services
            docker compose up -d --remove-orphans
            
            # Prune old images to save space
            docker image prune -f

