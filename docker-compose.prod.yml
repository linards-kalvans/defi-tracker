services:
  backend:
    # Use image from GHCR
    image: ghcr.io/linards-kalvans/defi-tracker/backend:latest
    ports:
      - "8000:8000"
    environment:
      # Use DATABASE_URL from the host environment (or .env file)
      - DATABASE_URL=${DATABASE_URL}
      # Kraken API Credentials
      - KRAKEN_API_KEY=${KRAKEN_API_KEY}
      - KRAKEN_SECRET=${KRAKEN_SECRET}
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "autoheal=true"

  frontend:
    # Use image from GHCR
    image: ghcr.io/linards-kalvans/defi-tracker/frontend:latest
    ports:
      - "3000:3000"
    environment:
      # Pass both standard and "RUNTIME_" prefixed vars
      # This tricks Next.js: it ignores RUNTIME_ during build (so no inlining),
      # allowing us to read them at runtime in EnvScript.js
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      - RUNTIME_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - RUNTIME_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "autoheal=true"

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    restart: always

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount config for auth
      - /root/.docker/config.json:/config.json
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300 # Check every 5 minutes
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: --interval 300
    restart: always
